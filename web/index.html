<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finanz Cockpit</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
  </head>
  <body>
    <div id="app" class="app-root">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">Finanz Cockpit</div>
          <div class="brand-subtitle">Privatbuchhaltung</div>
        </div>
        <nav class="nav">
          <button class="nav-button active" data-page="dashboard" title="Dashboard"><span>⌂</span><strong>Dashboard</strong></button>
          <button class="nav-button" data-page="payment-plan" title="Zahlungsplan"><span>▤</span><strong>Zahlungsplan</strong></button>
          <button class="nav-button" data-page="expenses" title="Ausgaben"><span>−</span><strong>Ausgaben</strong></button>
          <button class="nav-button" data-page="bookings" title="Buchungen"><span>≡</span><strong>Buchungen</strong></button>
          <button class="nav-button" data-page="analysis" title="Auswertung"><span>◌</span><strong>Auswertung</strong></button>
          <button class="nav-button" data-page="month-close" title="Monatsübersicht"><span>↔</span><strong>Monatsübersicht</strong></button>
          <button class="nav-button" data-page="settings" title="Einstellungen"><span>⚙</span><strong>Einstellungen</strong></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="live-hint">
          <div>Ausgewählter Monat</div>
          <strong id="sidebar-month">-</strong>
        </div>
      </aside>

      <main class="main-surface">
        <div id="toast" class="toast" hidden></div>
        <section id="reminder" class="reminder" hidden></section>

        <section id="page-dashboard" class="page active"></section>
        <section id="page-payment-plan" class="page"></section>
        <section id="page-expenses" class="page"></section>
        <section id="page-bookings" class="page"></section>
        <section id="page-analysis" class="page"></section>
        <section id="page-month-close" class="page"></section>
        <section id="page-settings" class="page"></section>
      </main>
    </div>

    <dialog id="modal" class="modal"></dialog>
    <dialog id="reminder-modal" class="modal reminder-modal">
      <form method="dialog" class="reminder-modal-form">
        <h2>Offene Zahlungen sind überfällig</h2>
        <div class="subtitle">Diese Einträge liegen in der Vergangenheit und sind noch nicht als erledigt markiert.</div>
        <div id="reminder-modal-list" class="list" style="margin-top:12px"></div>
        <div class="actions">
          <button id="reminder-snooze" class="ghost" value="cancel" type="button">Später erinnern</button>
          <button id="reminder-open-accounts" class="solid" type="button">Erstes Konto öffnen</button>
        </div>
      </form>
    </dialog>
    <dialog id="update-progress-modal" class="modal update-progress-modal">
      <form method="dialog" class="update-progress-form">
        <h2>Update läuft</h2>
        <div id="update-progress-status" class="subtitle">Warte auf Start…</div>
        <progress id="update-progress-bar" value="0" max="100"></progress>
        <div class="update-progress-meta">
          <span id="update-progress-percent">0 %</span>
          <span id="update-progress-bytes">0 B / -</span>
          <span id="update-progress-speed">0 B/s</span>
        </div>
        <div class="actions">
          <button id="update-progress-close" class="ghost" value="cancel" type="button">Im Hintergrund</button>
        </div>
      </form>
    </dialog>
    <div id="dropdown-overlay" class="dropdown-overlay" hidden></div>
    <div id="calendar-overlay" class="calendar-overlay" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
